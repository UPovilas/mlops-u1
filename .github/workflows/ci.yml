name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Unit tests
        run: uv run pytest tests

  image:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          TAG="sha-${GITHUB_SHA::12}"
          IMAGE="ghcr.io/upovilas/wine-u1:${TAG}"
          docker build -f docker/Dockerfile --build-arg GIT_COMMIT="$GITHUB_SHA" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"
