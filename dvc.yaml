stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/common.py
      - src/prepare.py
      - data/raw/wine.csv
    params:
      - split.test_size
      - split.random_state
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
  hpo:
    cmd: python src/hpo.py
    deps:
      - src/common.py
      - src/hpo.py
      - data/processed/train.csv
    params:
      - hpo
      - train.random_state
    outs:
      - models/best_params.json:
          cache: false
  train:
    cmd: python src/train.py
    deps:
      - src/common.py
      - src/train.py
      - data/raw/wine.csv
      - data/processed/train.csv
      - models/best_params.json
    params:
      - train.random_state
      - curve.steps
    outs:
      - models/model.pkl
      - models/run.json:
          cache: false
  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/common.py
      - src/evaluate.py
      - data/processed/test.csv
      - models/model.pkl
      - models/run.json
    metrics:
      - metrics.json:
          cache: false
  register:
    cmd: python src/quality_gate.py && python src/register.py
    deps:
      - src/common.py
      - src/quality_gate.py
      - src/register.py
      - models/run.json
      - metrics.json
    params:
      - gate.min_accuracy
