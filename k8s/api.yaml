apiVersion: apps/v1
kind: Deployment
metadata:
  name: wine-api
  namespace: wine-u1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wine-api
  template:
    metadata:
      labels:
        app: wine-api
    spec:
      containers:
        - name: api
          image: wine-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: MODEL_URI
              value: models:/wine-classifier@champion
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: wine-api
  namespace: wine-u1
spec:
  selector:
    app: wine-api
  ports:
    - port: 80
      targetPort: 8000
