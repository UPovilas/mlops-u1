[project]
name = "wine-mlops-u1"
version = "0.1.0"
description = "U1: reproducible Wine classification experiments with DVC and MLflow"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dvc==3.67.1",
    "fastapi>=0.146.0",
    "joblib==1.6.0",
    "mlflow==3.15.2",
    "optuna>=5.0.0",
    "pandas>=2.2,<3",
    "psutil>=7.2.2",
    "pyyaml>=6.0,<7",
    "scikit-learn==1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
